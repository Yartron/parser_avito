# Конфигурация Ruff — единый линтер для локальной разработки и CI.
# Набор правил копирует дефолты ruff (E4/E7/E9 + F): практичные,
# только реально опасные ошибки без стилистических придирок.
# Полный список правил: https://docs.astral.sh/ruff/rules/

line-length = 100
target-version = "py311"

[lint]
# E4  — логические ошибки в сравнениях/логах
# E7  — опасные управления потоком (E721/E722 и т.д.)
# E9  — синтаксические ошибки уровня интерпретатора
# F   — Pyflakes: неиспользуемый код, неопределённые имена
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

# F403/F405 — star-импорты (`from lang import *`) используются намеренно
# в GUI-слое для строк локализации lang.py. Не менять без согласования с владельцем.
ignore = [
    "F403",
    "F405",
]

[lint.per-file-ignores]
# Тесты не требуют такого же качества аннотаций, как основной код.
"tests/*" = []

# AvitoParser.py — GUI-слой: там же живут star-импорты локализации.
"AvitoParser.py" = []
