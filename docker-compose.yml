# In case you use podman-compose - it's recommended to install it from github. See: https://github.com/containers/podman-compose/issues/1275

services:
  parser_avito:
    container_name: avito
    # Тег образа: latest по умолчанию; деплой-workflow передаёт конкретную версию (IMAGE_TAG)
    image: ghcr.io/yartron/parser_avito:${IMAGE_TAG:-latest}
      #build:
      #  context: .
      #  dockerfile: Dockerfile
        #tags:
        #  - localhost/parser_avito:latest
    restart: always
    # Секретные данные (токены, прокси) можно передавать без правки config.toml:
    # раскомментируйте строку ниже и заполните .env по образцу .env.example
    # env_file:
    #   - .env
    volumes:
       - ./config.toml:/app/config.toml:ro
       - ./cookies.json:/app/cookies.json:Z
       - ./result:/app/result:Z
       - type: bind
         source: database.db
         target: /app/database.db
         bind:
           create_host_path: false
           selinux: Z
       #- $PWD/state.json:/app/state.json:Z
